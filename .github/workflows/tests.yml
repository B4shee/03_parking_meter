name: Run Unit Tests

on:
  push:
    branches-ignore:
      - main
    paths:
      - "parking_fee.py"
      - "parking_permit.py"
      - "test_parking.py"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "parking_fee.py"
      - "parking_permit.py"
      - "test_parking.py"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        run: python -m pytest -v
